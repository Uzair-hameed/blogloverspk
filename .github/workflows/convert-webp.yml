name: Convert Images to WebP

on:
  workflow_dispatch:
  push:
    paths:
      - 'posts-webp-urls.xlsx'

jobs:
  convert:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Dependencies
        run: |
          pip install pandas openpyxl
      
      - name: Run WebP Converter
        run: |
          python convert_webp.py
      
      - name: Check for Changes
        id: check
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit Changes
        if: steps.check.outputs.changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "🤖 Auto-convert image links to WebP"
          git push
      
      - name: Summary
        run: |
          echo "## ✅ WebP Conversion Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All image links have been converted to WebP format." >> $GITHUB_STEP_SUMMARY
