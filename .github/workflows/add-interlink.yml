name: Add Interlink to Posts

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  add-interlink:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Add Interlink to all HTML files
        run: |
          INTERLINK='<!-- INTERLINK --><script src="https://bloglovers.pk/interlink-data.js" defer></script><script src="https://bloglovers.pk/auto-interlink.js" defer></script>'
          
          for file in $(find . -name "*.html" -type f); do
            if ! grep -q "interlink-data.js" "$file"; then
              echo "✅ Adding interlink to: $file"
              sed -i "s|</body>|$INTERLINK</body>|g" "$file"
            else
              echo "⏭️ Skipping: $file (already has interlink)"
            fi
          done
      
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Auto: Add interlink to posts"
            git push
          fi
